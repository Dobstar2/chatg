name: SpatialHands
options:
  bundleIdPrefix: com.dobstar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SpatialHands:
    type: application
    platform: iOS
    sources:
      - SpatialHands
    info:
      path: SpatialHands/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dobstar.spatialhands
        PRODUCT_NAME: SpatialHands
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - SpatialHandsTests
  SpatialHandsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpatialHandsTests
    dependencies:
      - target: SpatialHands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dobstar.spatialhands.tests
        GENERATE_INFOPLIST_FILE: YES
