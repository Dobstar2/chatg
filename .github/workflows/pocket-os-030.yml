name: Pocket OS 0.3 Candidate

on:
  push:
    branches:
      - main
      - agent/pocket-spatial-os-030
    paths:
      - 'pocket-os-030/**'
      - '.github/workflows/pocket-os-030.yml'
  pull_request:
    paths:
      - 'pocket-os-030/**'
      - '.github/workflows/pocket-os-030.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: pocket-os-030
        run: npm run check
      - name: Regression tests
        working-directory: pocket-os-030
        run: npm test

  pages-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for GitHub Pages icon candidate and verify protected root
        shell: bash
        run: |
          set -euo pipefail
          candidate='https://dobstar2.github.io/chatg/pocket-os-030/'
          root='https://dobstar2.github.io/chatg/'
          for attempt in $(seq 1 48); do
            candidate_html=$(curl -fsSL --max-time 15 "${candidate}?smoke=${GITHUB_SHA}" || true)
            root_html=$(curl -fsSL --max-time 15 "${root}?smoke=${GITHUB_SHA}" || true)
            if grep -q 'POCKET OS 0.3 C1-H1-I1' <<<"${candidate_html}" && grep -q 'app-entry-icons-v1.js' <<<"${candidate_html}" && grep -q 'hand-tracking-v020.js?v=os030' <<<"${candidate_html}" && grep -q 'SAFARI TIMER' <<<"${root_html}"; then
              echo 'Pocket OS pictogram candidate is live, hand-runtime mapping is present, and protected root is unchanged.'
              exit 0
            fi
            echo "Pages not ready yet (attempt ${attempt}/48)."
            sleep 10
          done
          echo 'Timed out waiting for expected GitHub Pages icon candidate.' >&2
          exit 1
