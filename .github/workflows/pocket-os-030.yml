name: Pocket VR Release Candidate

on:
  push:
    branches:
      - main
      - agent/pocket-spatial-os-030
      - agent/pocket-spatial-os-030-c2
    paths:
      - 'pocket-os-030/**'
      - 'pocket-vr-next/tracking/**'
      - '.github/workflows/pocket-os-030.yml'
  pull_request:
    paths:
      - 'pocket-os-030/**'
      - 'pocket-vr-next/tracking/**'
      - '.github/workflows/pocket-os-030.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: pocket-os-030
        run: npm run check
      - name: Shared tracking regressions
        run: node --test pocket-vr-next/tests/*.test.*
      - name: Regression tests
        working-directory: pocket-os-030
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: pocket-os-030
      - run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: pocket-os-030
      - name: Exercise real UI in both engines
        working-directory: pocket-os-030
        run: |
          node scripts/serve.mjs > server.log 2>&1 &
          node scripts/browser-qa.cjs
      - name: Build isolated static artifact
        working-directory: pocket-os-030
        run: node scripts/build.mjs
      - name: Check built paths and optional dependency recovery
        working-directory: pocket-os-030
        run: node scripts/recovery-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-vr-rc1-evidence-and-static-build
          path: |
            pocket-os-030/test-results/
            pocket-os-030/dist/
            pocket-os-030/server.log

  pages-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for GitHub Pages RC1 and verify protected root
        shell: bash
        run: |
          set -euo pipefail
          candidate='https://dobstar2.github.io/chatg/pocket-os-030/'
          root='https://dobstar2.github.io/chatg/'
          for attempt in $(seq 1 48); do
            candidate_html=$(curl -fsSL --max-time 15 "${candidate}?smoke=${GITHUB_SHA}" || true)
            root_html=$(curl -fsSL --max-time 15 "${root}?smoke=${GITHUB_SHA}" || true)
            if grep -q 'Pocket VR 1.0 RC1' <<<"${candidate_html}" && grep -q 'src="./app.js?v=pocket-1rc1"' <<<"${candidate_html}" && grep -q 'hand-tracking-v020.js?v=os030c2' <<<"${candidate_html}" && grep -q 'SAFARI TIMER' <<<"${root_html}"; then
              echo 'Pocket VR RC1 is live, hand-runtime mapping is present, and protected root is unchanged.'
              exit 0
            fi
            echo "Pages not ready yet (attempt ${attempt}/48)."
            sleep 10
          done
          echo 'Timed out waiting for expected GitHub Pages RC1 candidate.' >&2
          exit 1
