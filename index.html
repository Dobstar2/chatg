<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070b" />
  <title>SpatialHands VR</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <video id="camera" playsinline muted></video>

  <div id="startScreen" class="start-screen">
    <div class="start-card">
      <div class="orb">◉</div>
      <h1>SpatialHands VR</h1>
      <p>Phone-headset mode with split-screen stereo, motion head tracking, rear-camera hand tracking and pinch-to-select.</p>
      <button id="startButton" class="primary">Enter VR</button>
      <p id="startStatus" class="small">Rotate your iPhone to landscape, place it in your headset, then tap Enter VR.</p>
    </div>
  </div>

  <main id="vrRoot" class="vr-root" aria-label="SpatialHands VR stereo interface">
    <section class="eye" id="leftEye">
      <div class="world" data-eye="left"></div>
    </section>
    <div class="divider"></div>
    <section class="eye" id="rightEye">
      <div class="world" data-eye="right"></div>
    </section>
  </main>

  <div class="hud" id="hud">
    <span id="motionState">HEAD: OFF</span>
    <span id="handState">HAND: OFF</span>
    <span id="cameraState">CAMERA: OFF</span>
  </div>

  <button id="recenterButton" class="recenter" aria-label="Recenter view">◎</button>

  <template id="worldTemplate">
    <div class="sky-glow"></div>
    <div class="shell">
      <header class="topbar glass">
        <div>
          <div class="eyebrow">SPATIALHANDS</div>
          <div class="title">Home</div>
        </div>
        <div class="status-dot"></div>
      </header>

      <div class="hero glass">
        <div class="hero-orb"></div>
        <div>
          <div class="eyebrow">VR WEB SHELL</div>
          <h2>Look around. Point. Pinch.</h2>
          <p>Move your head to shift the view. Hold your hand in front of the rear camera and pinch thumb-to-index to select.</p>
        </div>
      </div>

      <div class="app-grid">
        <button class="app-tile glass" data-action="browser">
          <span class="icon">◌</span><span>Browser</span><small>Web surface</small>
        </button>
        <button class="app-tile glass" data-action="media">
          <span class="icon">▶</span><span>Media</span><small>Local player</small>
        </button>
        <button class="app-tile glass" data-action="passthrough">
          <span class="icon">◉</span><span>Passthrough</span><small>Rear camera</small>
        </button>
        <button class="app-tile glass" data-action="settings">
          <span class="icon">⌁</span><span>Tracking</span><small>Calibration</small>
        </button>
      </div>

      <div class="dock glass">
        <button data-action="home">⌂</button>
        <button data-action="recenter">◎</button>
        <button data-action="info">i</button>
      </div>

      <div class="panel glass" data-panel="message">
        <strong>Ready</strong>
        <span>Pinch over a tile to open it.</span>
      </div>

      <div class="cursor" aria-hidden="true"><span></span></div>
    </div>
  </template>

  <script type="module" src="script.js"></script>
</body>
</html>
