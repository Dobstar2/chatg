<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080b12" />
  <title>Pocket Spatial — Safari Reset C</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#060810;color:#f7f9ff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#060810}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(125,191,255,.22),transparent 32%),#060810}
    main{width:min(100%,420px);display:grid;gap:16px;text-align:center}
    .chip{justify-self:center;padding:7px 11px;border-radius:999px;border:1px solid rgba(116,246,194,.3);background:rgba(23,66,55,.45);color:#74f6c2;font-size:10px;font-weight:900}
    h1{margin:0;font-size:36px;letter-spacing:-.05em;line-height:1}
    p{margin:0;color:rgba(238,244,255,.65);line-height:1.45}
  </style>
</head>
<body>
  <main>
    <div class="chip">SAFARI RESET C</div>
    <h1>Resetting Pocket Spatial</h1>
    <p id="status">Removing the stale runtime cache…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('pocket-spatial-runtime-')).map((key) => caches.delete(key)));
        }
        localStorage.removeItem('pocketSpatialRelease');
        sessionStorage.removeItem('pocketSpatialSwReload');
        status.textContent = 'Old cache removed. Opening Safari Fix C…';
        setTimeout(() => location.replace('./?fresh=safari-fix-c2'), 500);
      } catch (error) {
        status.textContent = `Reset failed: ${error?.message || error}`;
      }
    })();
  </script>
</body>
</html>
